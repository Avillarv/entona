# Corre las pruebas en cada pull request y en cada cambio que llega a main.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Guardar resultados si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-pruebas
          path: test-results/
          retention-days: 7
