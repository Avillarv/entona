# Publica el sitio en GitHub Pages cuando las pruebas pasan en main.
# Requiere activar Pages con la fuente «GitHub Actions» en Settings → Pages.
name: Publicar

on:
  workflow_run:
    workflows: [Pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preparar el sitio (solo los archivos de la aplicación)
        run: |
          mkdir _site
          cp -r index.html css js canciones _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
